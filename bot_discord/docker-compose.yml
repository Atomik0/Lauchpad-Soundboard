services:
  djm-soundboard-bot:
    build: .
    container_name: djm-soundboard-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      - TOKEN=${TOKEN:-${DISCORD_TOKEN:-TU_DISCORD_BOT_TOKEN_AQUI}}
      - PREFIX=${PREFIX:-/}
      - LOCALE=${LOCALE:-es}
      - NAME=${NAME:-${BOT_NAME:-DJM BOT 24/7}}
      - TYPE=0
      - PORT=${PORT:-3002}
      - SECRET_KEY=${SECRET_KEY:-launchpad2026}
      - STORAGE_DIR=/app/storage/sounds
    volumes:
      - ./storage/sounds:/app/storage/sounds
